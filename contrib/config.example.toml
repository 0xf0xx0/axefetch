[general]
# IP address of your *axe
ip = 'replace me'

[display]
# Neofetch-like
# See https://pkg.go.dev/git.0xf0xx0.eth.limo/0xf0xx0/oigiki for color tag docs
# invalid lines are ignored
format = """
this is an invalid line, so its not printed :3
info title
info underline
info "Model" model
info "Asic" asic
info "Firmware" firmware
info "Uptime" uptime
info "Best Difficulty" bestdiff
info "Shares" shares
info "Pool" pool
info "Hashrate" hashrate
info "Efficiency" efficiency
info "Temperature" temp
info "Heap" heap

prin circlejerking into open source
"""
# Selected icon name or path
# Default: 'family'
# Values: 'asic', 'family', 'none', or path to ascii art in a plaintext file
icon = 'family'
# Spaces between the icon and the info
icon_spacing = 3
# Default: 'family'
# Values: 'family', 'manual', or theme name
theme = 'family'
bold_titles = true
# Separator between subtitle and info
separator = ':'
# Underline char
underline = '-'

# Supports everything display.format does
[theme]
title = 'green'
at = 'green'
underline = 'white'
subtitle = 'green'
separator = 'blue'
info = 'white'
# Default icon color, if the icon doesn't specify it's own
icon = 'green'

[title]
worker_name = true
hostname = true

[model]
board_version = true
family = true
vendor = false

[asic]
count = true
frequency = true

[bestdiff]
ath = true
session = true
# 'on' or 'off'
shortpaw = 'off'

[efficiency]
expected = true
actual = true
# 'on' or 'off'
shortpaw = 'off'

[firmware]
version = true

[hashrate]
expected = true
actual = true
# 'on' or 'off'
shortpaw = 'off'

[pool]
port = true

[shares]
# 'on', 'tiny' or 'off'
shortpaw = 'off'
ratio = true

[temp]
# 'on', 'tiny' or 'off'
shortpaw = 'off'
asic = true
vreg = true

[uptime]
format = '%dd %hh %mm %ss'
